name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-v2-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-v2-

      - name: Restore dependencies
        run: dotnet restore NebulaPanel.sln

      - name: Clean before build
        run: dotnet clean NebulaPanel.sln --configuration Release

      - name: Build
        run: dotnet build NebulaPanel.sln --configuration Release --no-restore

      - name: Run tests with coverage
        run: |
          dotnet test NebulaPanel.sln \
            --configuration Release \
            --no-build \
            --collect:"XPlat Code Coverage" \
            --settings coverage.runsettings \
            --results-directory ./TestResults \
            --logger "trx;LogFileName=test-results.trx"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:./TestResults/**/coverage.cobertura.xml \
            -targetdir:./TestResults/CoverageReport \
            -reporttypes:"Html;MarkdownSummaryGithub;Cobertura"

      - name: Check coverage threshold
        run: |
          COVERAGE=$(grep -oP 'line-rate="\K[^"]+' ./TestResults/CoverageReport/Cobertura.xml | head -1)
          COVERAGE_PERCENT=$(echo "$COVERAGE * 100" | bc -l | cut -d. -f1)
          echo "Code coverage: ${COVERAGE_PERCENT}%"

          # Threshold set to 20% during active development
          # TODO: Increase to 50%+ as test coverage improves
          if [ "$COVERAGE_PERCENT" -lt 20 ]; then
            echo "::error::Code coverage ${COVERAGE_PERCENT}% is below the 20% threshold"
            exit 1
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/*.trx
          retention-days: 30

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./TestResults/CoverageReport
          retention-days: 30

      - name: Add coverage summary to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summaryPath = './TestResults/CoverageReport/SummaryGithub.md';

            if (fs.existsSync(summaryPath)) {
              const summary = fs.readFileSync(summaryPath, 'utf8');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: '## Code Coverage Report\n\n' + summary
              });
            }
